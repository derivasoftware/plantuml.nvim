# CI — plantuml.nvim. Build the pinned grammar into the runtimepath and
# run the headless smoke on the shell runner's Neovim.

include:
  - project: deriva/infra/ci-templates
    ref: main
    file:
      - /templates/base.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

smoke:
  stage: test
  script:
    # the shell runner has no system nvim: fetch the official tarball
    # once into the persistent workspace and reuse it across jobs
    - |
      if ! command -v nvim >/dev/null 2>&1; then
        if [ ! -x .ci-tools/nvim-linux-x86_64/bin/nvim ]; then
          mkdir -p .ci-tools
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.3/nvim-linux-x86_64.tar.gz | tar -xz -C .ci-tools
        fi
        export PATH="$PWD/.ci-tools/nvim-linux-x86_64/bin:$PATH"
      fi
    # job-local git config: the shell runner's HOME gitconfig outlives
    # jobs and can carry rewrites with expired tokens
    - export GIT_CONFIG_GLOBAL="$CI_PROJECT_DIR/.gitconfig-ci"
    - git config --file "$GIT_CONFIG_GLOBAL"
      url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf
      "https://${CI_SERVER_HOST}/"
    - make clean && make
    - nvim --headless -u tests/minimal_init.lua -l tests/smoke.lua
    # integration: real keys against the real language server
    - |
      if [ ! -x .ci-tools/lsp-venv/bin/plantuml-lsp ]; then
        python3 -m venv .ci-tools/lsp-venv
      fi
    - GIT_CONFIG_GLOBAL="$CI_PROJECT_DIR/.gitconfig-ci"
      .ci-tools/lsp-venv/bin/pip install -q --upgrade
      "plantuml-lsp @ git+https://${CI_SERVER_HOST}/deriva/plantuml/plantuml-lsp.git@v0.5.0"
    - PLANTUML_LSP_BIN="$PWD/.ci-tools/lsp-venv/bin/plantuml-lsp"
      nvim --headless -u tests/minimal_init.lua -l tests/integration.lua
