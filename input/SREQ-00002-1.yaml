requirement:
  id: SREQ-00002-1
  title: The plugin shall serve the interactive preview from a local page
  description: >
    The plugin shall serve the interactive preview from a local page.
  rationale: >
    Roadmap: a :PlantumlPreview command starting a small local server —
    plantuml-render's browser bundle plus the interactive page (drag,
    filters, pan/zoom, jar engine option) reloading on save. Extracting
    the page from the VS Code webview also makes the preview
    editor-agnostic, with the extension as one more consumer.
  owner: dcoello-dev
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00001-1
