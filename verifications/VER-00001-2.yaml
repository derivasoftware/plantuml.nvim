verification:
  id: VER-00001-2
  req_id: REQ-00001-1
  title: The headless smoke proves parser and queries load from the built runtimepath
  description: >
    The smoke suite builds nothing: it asserts the Makefile output is
    live in the runtimepath — the parser loads, a buffer parses without
    errors, and each shipped query compiles. Revision 2 cites the case
    ids the suites now record as junit evidence.
  method: test
  test_ids:
    - tests/smoke.lua::parser loads
    - tests/smoke.lua::parses without errors
    - tests/smoke.lua::query highlights
    - tests/smoke.lua::query folds
    - tests/smoke.lua::query indents
  status: APPROVED
